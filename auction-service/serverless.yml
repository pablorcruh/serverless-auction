# "org" ensures this Service is used with the correct Serverless Framework Access Key.
org: pablorcruh
# "app" enables Serverless Framework Dashboard features and sharing them with other Services.
app: auction-service
# "service" is the name of this project. This will also be added to your AWS resource names.
service: auction-service

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  environment:
    AUCTION_TABLE_NAME: ${self:custom.AuctionTable.name}
  iam:
    role:
      statements:
        - ${file(iam/AuctionTableIAM.yml):AuctionTableIAM}

functions:
  createAuction:
    handler: src/handlers/createAuction.handler
    events:
      - httpApi:
          path: /auction
          method: post
  getAuctions:
    handler: src/handlers/getAuctions.handler
    events:
      - httpApi:
          path: /auctions
          method: get
  getAuction:
    handler: src/handlers/getAuction.getAuction
    events:
      - httpApi:
          path: /auctions/{id}
          method: get

custom:
  AuctionTable:
    name: !Ref AuctionTable
    arn: !GetAtt AuctionTable.Arn

resources:
  Resources:
    AuctionTable: ${file(resources/AuctionTable.yml):AuctionTable}
      